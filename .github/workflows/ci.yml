name: CI

# Why this exists, in one line: `npm test` and `vite build` both pass on an app
# that cannot render, so those two alone are not a gate. See the `smoke` job.
on:
  pull_request:
  push:
    branches: [main]

# Every job below reads the checkout and nothing else — tests, a build, a local
# vite server, three linters. The repository's Actions default token is already
# read-only, but that is a SETTING no reader of this file can see; stating the
# scope here puts it in the diff and survives someone widening the default.
# Workflows that genuinely need more declare their own (claude.yml, codeql.yml).
permissions:
  contents: read

# A newer push supersedes an in-flight run for the same ref — but only on a
# PR. On main every commit is a distinct thing that shipped, and cancelling
# its run to start the next one destroys the record of whether the first was
# ever green. Two pushes a minute apart would leave the earlier one with no
# verdict at all.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Fast, zero-dependency. node --test over test/, plus the production build
  # with placeholder env (the real VITE_* values are baked at build time on
  # Vercel; placeholders prove the bundle compiles without leaking secrets).
  checks:
    # REQUIRED CHECK. This exact string is what the "Protect Main" ruleset
    # requires, alongside "render check" and "static checks". Rename it and the
    # gate silently stops gating — there is nothing local that can catch that.
    name: tests + build
    runs-on: ubuntu-latest
    # Every step here finishes in seconds; anything past this is a stall, and
    # GitHub's default would otherwise let it sit for SIX HOURS.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Includes test/apiLoads.test.js, which is the ONLY thing that catches a
      # dangling import in api/ — nothing else loads those files, so a broken
      # route otherwise ships green and 500s on the first real request.
      # Through the TAP digest (2026-09-04): a green run logs ~10 lines, a red
      # run logs every failing block verbatim, so the log TAIL a session pulls
      # with get_job_logs is the failures, not the last 500 of 5,700 `ok` lines.
      # pipefail keeps a crashed `npm test` red even if the digest exits 0; the
      # digest itself exits 1 on any failure and passes a summary-less run
      # through untouched (test/claudeConfigGuards.test.js pins both).
      - name: tests (digested)
        run: |
          set -o pipefail
          npm test 2>&1 | .claude/hooks/test-digest.sh
      - name: build (placeholder env)
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder
        run: npm run build

  # The gate the other job can't be: renders the real Dashboard in a real
  # browser against mocked I/O, and clicks through EVERY tab. A
  # use-before-declaration in Dashboard.jsx is a ReferenceError on first render
  # that passes tests AND build — it shipped once and showed every user the
  # ErrorBoundary. Visiting one tab only proved that tab; each tab renders a
  # different slice of a ~5,000 line component.
  smoke:
    # REQUIRED CHECK, exactly as with "tests + build" above (and "static
    # checks" below): the ruleset matches on this string.
    name: render check
    runs-on: ubuntu-latest
    # The backstop for anything that stalls (historically: apt, see the install
    # step). Without it a stall blocks the merge for GitHub's six-hour default
    # and looks identical to "still running".
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `--with-deps` shells out to apt, and apt is the one genuinely unbounded
      # thing in this workflow. Observed 2026-08-05: this step took ~10s on
      # most runs and 10m43s on one, while every other step held steady at a
      # few seconds — i.e. the mirror, not the repo. Nothing bounded it, and an
      # unbounded stall is worse than a failure: it reads as "still running"
      # and silently blocks the merge. So apt is now the FALLBACK rather than
      # the default path, every attempt is bounded, and the browser itself
      # comes from the CDN (which the cache below usually makes free).
      #
      # Cached across runs so the usual case never touches the network at all.
      # Keyed on the pinned version below: bump the pin and the key changes,
      # so a stale browser can never be served for a new driver.
      # Action majors (checkout v7 / setup-node v7 / cache v6, 2026-08-11):
      # the v4s ran on the deprecated node20 runtime and warned on every job.
      # Verified before bumping: our bare checkout, explicit `cache: npm`, and
      # unchanged path/key inputs are untouched by every breaking change in
      # between (v6 checkout's persist-credentials move, v7's fork-PR refusal
      # under pull_request_target — we trigger on plain pull_request).
      - name: cache browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.62.1
      - name: install browser driver
        timeout-minutes: 9
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Pinned, not `@1`: a floating major means a driver upgrade lands on
          # an unrelated PR and its failure looks like that PR's fault.
          npm install --no-save playwright-core@1.62.1 playwright@1.62.1
          # CDN-first. The browser download is the part that must succeed; apt
          # (--with-deps) is the flaky part and is now only a fallback.
          if timeout 240 npx playwright install chromium; then
            exit 0
          fi
          echo "browser download stalled or failed; retrying with system deps"
          for attempt in 1 2; do
            if timeout 240 npx playwright install --with-deps chromium; then
              exit 0
            fi
            echo "attempt $attempt stalled or failed"
          done
          # Nothing worked. Fail loudly here rather than let the next step die
          # with a confusing "browser not found".
          echo "could not install the browser after 3 attempts"
          exit 1
      - name: boot harness and assert the app renders
        run: |
          npx vite --config test/smoke/vite.config.js --port 5199 > /tmp/vite-smoke.log 2>&1 &
          # Plain poll rather than a wait-on dependency.
          for _ in $(seq 1 60); do
            curl -sf http://localhost:5199 >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:5199 >/dev/null || (echo "harness never came up"; cat /tmp/vite-smoke.log; exit 1)
          node test/smoke/render.mjs
      - name: harness log on failure
        if: failure()
        run: cat /tmp/vite-smoke.log || true

  # Free static checks — no Claude tokens, no browser, no apt. Three tools,
  # each for a class of breakage neither job above can see:
  #   eslint     — an undefined identifier, or a hook called inside a branch,
  #                is a ReferenceError on first render that `vite build` and
  #                `npm test` both pass. The render gate catches the ones on a
  #                path it walks; this catches the rest. It found a
  #                conditionally-called useMemo in the PDF template editor on
  #                its first run. Rules and reasons: eslint.config.js.
  #   actionlint — the workflows in this directory ARE the merge gate, and they
  #                have no test. A typo in an `if:` or a `${{ }}` is a run that
  #                never happens, or a job that never gates. It also pipes
  #                every `run:` block through shellcheck.
  #   shellcheck — .claude/hooks/*.sh run in every session AND inside the
  #                tests job above (test-digest.sh is on the other end of that
  #                pipe), so a bashism that dash rejects breaks the gate.
  # REQUIRED CHECK: "static checks" is a ruleset-required name exactly like the
  # two above. Rename it and the gate silently stops gating.
  static:
    name: static checks
    runs-on: ubuntu-latest
    # Seconds of work; anything past this is a stall, and GitHub's default
    # would let it sit for SIX HOURS.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: eslint
        run: npm run lint
      # ubuntu-latest ships shellcheck. Printing the version first makes an
      # absent binary a loud failure rather than a check that quietly passes.
      # `-s sh` because both hooks are `#!/bin/sh` (pinned by
      # test/claudeConfigGuards.test.js) — the default assumes bash and would
      # wave through a bashism that breaks them at session start.
      - name: shellcheck (.claude/hooks)
        run: |
          shellcheck --version
          shellcheck -s sh .claude/hooks/*.sh
      # Pinned version AND pinned script ref, for the reason the playwright
      # driver above is pinned: a floating version lands new rules on an
      # unrelated PR, where the failure looks like that PR's fault. Bump the
      # two together. This download is the job's only network step, so it is
      # bounded (the apt lesson above: an unbounded stall reads as "still
      # running" and blocks the merge without ever failing).
      - name: actionlint (workflows)
        timeout-minutes: 5
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
