# Lets anyone summon Claude onto a pull request or issue by writing @claude in a
# comment — from GitHub itself, or a phone, with NO Claude Code session running.
#
# Why this exists, in one line: the GitHub integration sessions already use is
# SESSION-SCOPED. It authenticates as Mason's own account (which is why PRs read
# "opened by masonberger4"), so it works only while a session is running and
# driving it — nothing reached this repo between sessions. This workflow is the
# repo-side half that does.
#
# EVENT-DRIVEN, never polling: it fires on a comment, not a timer. The standing
# "an armed PR needs no babysitting" ruling (no check-in Routines) is untouched.
#
# INERT UNTIL USED: the `if` below means a comment without @claude never starts a
# runner. Until someone types the phrase this file adds no check, no red X, and
# no delay to armed auto-merge — so it is safe to merge before the secret exists.
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  # This job name must NEVER become one of the branch ruleset's required checks
  # ("tests + build", "render check"). Claude answers a mention; it is not a gate,
  # and a required check that only sometimes runs reports pending FOREVER rather
  # than passing — the same mechanic that refuted paths-ignore on docs/.
  claude:
    name: claude mention
    # Cheap pre-filter so runners don't start on the ~all comments that aren't for
    # Claude (Vercel's bot comments on every PR). The action re-checks the trigger
    # phrase itself; this only avoids booting a runner to learn that.
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    # The FIRST write-scoped workflow in this repo — ci.yml needs none and declares
    # `contents: read` territory only. Claude pushes commits and posts comments when
    # asked to, so it needs write; this is the action's documented minimum, listed
    # explicitly per the house rule that every new workflow states its permissions.
    # `actions: read` is what lets Claude read CI results on the PR it was called to.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    # Same reason every ci.yml job is bounded: an unbounded stall reads as "still
    # running" rather than failing, and GitHub's default would let it sit for SIX
    # HOURS.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          # Authenticates against the Claude subscription rather than API billing.
          # To bill the API account instead, swap this one line for
          # `anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}` — they are
          # alternatives, never both. Note that secret is NOT the Ask tab's key:
          # that one is a Vercel runtime variable and is invisible to Actions.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # DELIBERATELY no `github_token:`. GitHub does not trigger workflows on
          # commits made with the default GITHUB_TOKEN, so passing it would leave
          # Claude's pushes with no ci.yml run at all — green by absence, on the
          # one repo whose merge gate IS CI. Omitting it authenticates as the
          # Claude GitHub App, whose pushes do fire CI.
