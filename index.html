<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>my-money</title>

    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- --bg light/dark, kept in lockstep with src/ui.css. These follow the OS;
         src/theme.js rewrites both @content values when a theme is forced. -->
    <meta name="theme-color" content="#F7F6F2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#18181A" media="(prefers-color-scheme: dark)" />

    <!-- iOS home-screen app -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="my-money" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/icon-192.png" type="image/png" />

    <!-- Pre-paint theme. Deliberately duplicates src/theme.js (key 'mm:theme',
         data-theme="light|dark") because it must run before any bundle loads —
         that is what stops a flash of the wrong theme. No stored preference =>
         no attribute => the media queries below and in ui.css follow the OS.
         Must be a no-op on failure: storage access THROWS in Safari private
         mode. Keep in sync with src/theme.js. -->
    <script>
      try {
        var t = localStorage.getItem('mm:theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>

    <style>
      /* These two hardcoded colors are --bg's light/dark values from
         src/ui.css — parsed before the stylesheet loads, so they must be
         changed in lockstep with it. */
      html, body { margin: 0; background: #F7F6F2; }
      @media (prefers-color-scheme: dark) { html, body { background: #18181A; } }
      /* A forced theme must beat the OS in both directions. */
      html[data-theme="light"], html[data-theme="light"] body { background: #F7F6F2; }
      html[data-theme="dark"], html[data-theme="dark"] body { background: #18181A; }
      /* Pad the app for the iPhone notch + home indicator when launched
         from the home screen with status-bar-style: black-translucent. */
      body {
        padding-top: env(safe-area-inset-top);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
        padding-bottom: env(safe-area-inset-bottom);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
