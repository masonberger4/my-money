<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>my-money</title>

    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#F7F6F2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#18181A" media="(prefers-color-scheme: dark)" />

    <!-- iOS home-screen app -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="my-money" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/icon-192.png" type="image/png" />
    <style>
      html, body { margin: 0; background: #F7F6F2; }
      @media (prefers-color-scheme: dark) { html, body { background: #18181A; } }
      /* Pad the app for the iPhone notch + home indicator when launched
         from the home screen with status-bar-style: black-translucent. */
      body {
        padding-top: env(safe-area-inset-top);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
        padding-bottom: env(safe-area-inset-bottom);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
