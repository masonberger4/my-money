# Supabase CLI config — FRESH INSTALLS ONLY.
#
# This file exists so that a brand-new Supabase project can be built by
# replaying `supabase/migrations/` with the CLI:
#
#   supabase link --project-ref <ref-of-a-NEW-empty-project>
#   supabase db push
#   # then paste supabase/bootstrap_household.sql in the SQL Editor
#
# DO NOT link the LIVE household project. Migrations on prod are pasted by
# hand into the Supabase SQL Editor, in the order (and sometimes the inverted
# deploy order) each migration's header specifies — `db push` cannot honour
# "paste this one AFTER the deploy", and the CLI would want to baseline a
# history it never ran. Prod is never linked and never baselined.
#
# Deliberately minimal: the CLI's config surface changes between releases and
# this project runs it approximately never. Every key here is one the link +
# push path actually reads; add nothing speculatively.

# Overwritten by `supabase link` with the real project ref. The placeholder is
# just a name for local scaffolding — it is not a secret and not the live ref.
project_id = "my-money"

[db]
# Local shadow/dev database used to diff and validate migrations before push.
# Set this to match the REMOTE project's Postgres major version — check it with
# `supabase projects list` — or the shadow DB can accept SQL the remote rejects.
# 15 is the version Supabase provisioned for this project's era; new projects
# are provisioned newer, so verify rather than trusting this number.
major_version = 15
